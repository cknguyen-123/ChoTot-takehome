# Used by `make run` and `make test`; see Makefile. The project name (-p) is set
# by the Makefile so parallel runs on different ports never touch each other.
#
# Credentials below are local-development defaults, not secrets.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: moderation
      POSTGRES_DB: moderation
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moderation -d moderation"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Not published to the host: only the API talks to it.

  api:
    build:
      context: .
      target: runtime
    init: true
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://moderation:moderation@db:5432/moderation
    ports:
      # Host port from PORT (default 8080); container port is fixed.
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Moderation worker: same image as the API, different entry point. Several
  # replicas are safe (`docker compose up --scale worker=3`); all coordination
  # is in Postgres (ARCHITECTURE.md §8).
  worker:
    build:
      context: .
      target: runtime
    command: ["node", "src/worker.js"]
    init: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://moderation:moderation@db:5432/moderation
    depends_on:
      db:
        condition: service_healthy

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    init: true
    environment:
      LOG_LEVEL: error
      # Admin connection; each test file creates and drops its own database here.
      TEST_DATABASE_URL: postgres://moderation:moderation@test-db:5432/postgres
    depends_on:
      test-db:
        condition: service_healthy

  # Throwaway Postgres for `make test`: data lives in memory (tmpfs) and is gone
  # when scripts/test.sh runs `down`. Never shares anything with `db`.
  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: moderation
      POSTGRES_DB: moderation
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moderation -d moderation"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
